name: tone_desk
description: Make a Material 3 theme in three steps, then ship it to Flutter, CSS, Tailwind, or design tokens.
publish_to: none

version: 3.0.0

environment:
  sdk: ">=3.14.0-0 <4.0.0"
  flutter: ">=3.50.0-0"

dependencies:
  bloc: ^9.2.1
  equatable: ^3.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  google_fonts: ^9.0.0
  material_color_utilities: ^0.13.0
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/github-mark.png
